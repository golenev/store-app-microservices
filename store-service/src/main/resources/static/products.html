<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shop.css">
<title>Каталог и корзина</title>
<script type="module" src="/products.js">
</script>
</head>
<body>
<nav aria-label="Навигация">
<a href="/index.html">Главная</a>
<a href="/products.html">Каталог и корзина</a>
<a href="/send-to-kafka.html">Поставщик</a>
</nav>
<h1>Каталог и корзина</h1>
<p class="hint">Корзина не резервирует товар. Остаток проверяется ещё раз при оформлении.</p>
<div class="toolbar">
<label>Магазин <select id="store-id">
<option value="S-1">S-1 · Москва</option>
<option value="S-2">S-2 · Санкт-Петербург</option>
</select>
</label>
<button id="refresh" class="secondary" disabled>Обновить</button>
<button id="new-cart" class="secondary" disabled>Новая корзина</button>
</div>
<p id="message" class="message" role="alert">
</p>
<main class="layout">
<section aria-label="Каталог">
<div id="product-list">
</div>
</section>
<aside id="cart" class="panel" aria-label="Корзина">
<h2>Корзина</h2>
<p id="cart-state">
</p>
<div id="cart-items">
</div>
<p id="cart-total" class="cart-total">
</p>
<div class="actions">
<button id="submit" disabled>Оформить заявку</button>
<button id="retry" hidden>Повторить оформление</button>
</div>
<div id="operation" aria-live="polite">
</div>
<p class="hint">Оплата и исполнение заказа — за пределами проекта.</p>
</aside>
</main>
</body>
</html>
