<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/shop.css">
<title>Поставщик</title>
<script type="module" src="/delivery.js">
</script>
</head>
<body>
<nav aria-label="Навигация">
<a href="/index.html">Главная</a>
<a href="/products.html">Каталог и корзина</a>
<a href="/send-to-kafka.html">Поставщик</a>
</nav>
<h1>Эмулятор поставщика</h1>
<p class="hint">Уникальная поставка увеличивает общий остаток продукта. Последняя принятая поставка задаёт его цену.</p>
<div class="toolbar">
<label>Магазин <select id="store-id">
<option value="S-1">S-1 · Москва</option>
<option value="S-2">S-2 · Санкт-Петербург</option>
</select>
</label>
</div>
<p id="message" class="message" role="alert">
</p>
<main class="panel wide">
<form id="delivery-form" class="form-grid">
<label>Код продукта<input name="productId" required maxlength="64" placeholder="P-COFFEE">
</label>
<label>Тип товара<select name="type">
<option value="NON_FOOD">Непродовольственный</option>
<option value="FOOD">Продовольственный</option>
</select>
</label>
<label>Название<input name="shortName" required maxlength="255">
</label>
<label>Описание<textarea name="description" maxlength="2000">
</textarea>
</label>
<label>Количество<input name="quantity" type="number" min="1" max="2147483647" step="1" value="10" required>
</label>
<label>Закупочная цена, ₽<input name="purchasePrice" inputmode="decimal" value="100.00" required>
</label>
<button type="submit" disabled>Отправить поставку</button>
</form>
<div class="actions">
<button id="retry" hidden>Повторить поставку</button>
<button id="new-delivery" class="secondary" disabled>Новая поставка</button>
</div>
<section id="delivery-result" aria-live="polite">
</section>
</main>
</body>
</html>
