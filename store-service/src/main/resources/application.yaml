spring:
  application:
    name: store-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:34567/store_db}
    username: ${DB_USER:store_app}
    password: ${DB_PASSWORD:store_local}
  sql:
    init:
      mode: never
  flyway:
    enabled: true
    baseline-on-migrate: false
    clean-disabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      enable-auto-commit: false
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      max-poll-records: 10
      properties:
        max.partition.fetch.bytes: 16777216
    listener:
      ack-mode: record
server:
  port: ${SERVER_PORT:6789}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
