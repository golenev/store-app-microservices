name: Shop Runtime CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven
      - name: Validate runtime and E2E Compose
        run: docker compose config --quiet
      - name: Run reactor unit and integration tests
        run: mvn -B -ntp test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reactor-junit-results
          path: |
            contract-tests/target/surefire-reports/
            store-service/target/surefire-reports/
            tariffs-service/target/surefire-reports/
            warehouse-service/target/surefire-reports/

  e2e:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 25
    env:
      E2E_REVISION: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: gradle
      - name: Verify wrapper checksum
        run: echo '7d3a4ac4de1c32b59bc6a4eb8ecb8e612ccd0cf1ae1e99f66902da64df296172  e2e-tests/gradle/wrapper/gradle-wrapper.jar' | sha256sum --check
      - name: Verify installed Chrome for Selenide
        run: google-chrome --version
      - name: Start application services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Run backend and Selenide E2E
        working-directory: e2e-tests
        run: bash gradlew --no-daemon test
      - name: Save E2E diagnostics and stop containers
        if: always()
        run: |
          docker compose logs --no-color > e2e-compose.log
          docker compose down
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kotlin-e2e-reports-and-diagnostics
          path: |
            e2e-tests/build/reports/tests/
            e2e-tests/build/test-results/
            e2e-tests/build/allure-results/
            e2e-tests/build/browser-evidence/
            e2e-compose.log

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Build and start all services
        run: docker compose up -d --build --wait --wait-timeout 180
      - name: Verify tariff quote cache and CRUD
        shell: bash
        run: |
          rule='{"productType":"NON_FOOD","cityId":"CI_TARIFF","currency":"RUB","lowerBound":"0.00","upperBound":null,"markupRate":"0.20"}'
          id=$(curl --fail --silent -H 'Content-Type: application/json' -d "$rule" http://localhost:6790/tariffs/rules | jq -r '.tariffRuleId')
          quote='http://localhost:6790/tariffs/quote?productType=NON_FOOD&purchasePrice=100.00&currency=RUB&cityId=CI_TARIFF'
          curl --fail --silent "$quote" | jq -e '.markupRate == "0.20" and .tariffVersion == 1'
          updated='{"productType":"NON_FOOD","cityId":"CI_TARIFF","currency":"RUB","lowerBound":"0.00","upperBound":null,"markupRate":"0.30"}'
          curl --fail --silent -X PUT -H 'Content-Type: application/json' -d "$updated" "http://localhost:6790/tariffs/rules/$id" | jq -e '.version == 2'
          curl --fail --silent "$quote" | jq -e '.markupRate == "0.20" and .tariffVersion == 1'
          curl --fail --silent -X POST http://localhost:6790/tariffs/cache/reset | jq -e '.cache == "tariff-quotes"'
          curl --fail --silent "$quote" | jq -e '.markupRate == "0.30" and .tariffVersion == 2'
          curl --fail --silent -X DELETE "http://localhost:6790/tariffs/rules/$id"
      - name: Verify warehouse delivery and GoodsPosted outbox
        shell: bash
        run: |
          curl --fail --silent -H 'Content-Type: application/json' --data-binary @contracts/examples/events/delivery-received.json http://localhost:6791/technical/deliveries | jq -e '.publicationStatus == "PUBLISHED"'
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:6791/stores/S-1/deliveries/D-1 | jq -e '.state == "POSTED" and .items[0].salePrice == "120.00"'; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:6791/stores/S-1/deliveries/D-1 | jq -e '.state == "POSTED" and .attemptCount >= 1'
          for attempt in $(seq 1 30); do
            status=$(docker compose exec -T -e PGPASSWORD=warehouse_local postgres psql -h localhost -U warehouse_app -d warehouse_db -Atc "SELECT publication_status FROM warehouse_outbox WHERE store_id='S-1' AND delivery_id='D-1'")
            if test "$status" = PUBLISHED; then break; fi
            sleep 1
          done
          test "$status" = PUBLISHED
          curl --fail --silent -H 'Content-Type: application/json' --data-binary @contracts/examples/events/delivery-received.json http://localhost:6791/technical/deliveries | jq -e '.publicationStatus == "PUBLISHED"'
      - name: Verify STORE inventory and independent carts
        shell: bash
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -e '.items | length == 1'; then break; fi
            sleep 1
          done
          curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -e '.items[0].availableQuantity == 10 and .items[0].unitPrice == "120.00"'
          stock=$(curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -r '.items[0].stockItemId')
          first=$(curl --fail --silent -X POST http://localhost:6789/stores/S-1/carts | jq -r '.cartId')
          second=$(curl --fail --silent -X POST http://localhost:6789/stores/S-1/carts | jq -r '.cartId')
          test "$first" != "$second"
          for cart in "$first" "$second"; do
            curl --fail --silent -X PUT -H 'Content-Type: application/json' -d '{"quantity":10,"expectedCartVersion":0}' "http://localhost:6789/stores/S-1/carts/$cart/items/$stock" | jq -e '.version == 1 and .totalAmount == "1200.00"'
          done
          curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -e '.items[0].availableQuantity == 10'
          printf 'SMOKE_CART=%s\n' "$first" >> "$GITHUB_ENV"
      - name: Verify atomic STORE submission and OrderSubmitted outbox
        shell: bash
        run: |
          stock=$(curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -r '.items[0].stockItemId')
          curl --fail --silent -X PUT -H 'Content-Type: application/json' -d '{"quantity":3,"expectedCartVersion":1}' "http://localhost:6789/stores/S-1/carts/$SMOKE_CART/items/$stock" | jq -e '.version == 2 and .totalAmount == "360.00"'
          accepted=$(curl --fail --silent -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: compose-submit' -d '{"expectedCartVersion":2}' "http://localhost:6789/stores/S-1/carts/$SMOKE_CART/submit")
          submission=$(printf '%s' "$accepted" | jq -r '.submissionId')
          for attempt in $(seq 1 30); do
            if curl --fail --silent "http://localhost:6789/stores/S-1/submissions/$submission" | jq -e '.publicationStatus == "PUBLISHED" and .publishedAt != null'; then break; fi
            sleep 1
          done
          curl --fail --silent "http://localhost:6789/stores/S-1/submissions/$submission" | jq -e '.publicationStatus == "PUBLISHED"'
          repeated=$(curl --fail --silent -X POST -H 'Content-Type: application/json' -H 'Idempotency-Key: compose-submit' -d '{"expectedCartVersion":2}' "http://localhost:6789/stores/S-1/carts/$SMOKE_CART/submit" | jq -r '.submissionId')
          test "$repeated" = "$submission"
          curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -e '.items[0].availableQuantity == 7'
          printf 'SMOKE_SUBMISSION=%s\n' "$submission" >> "$GITHUB_ENV"
      - name: Verify health, roles and restart persistence
        shell: bash
        run: |
          for port in 6789 6790 6791; do
            curl --fail --silent "http://localhost:$port/actuator/health" | grep '"status":"UP"'
          done
          docker compose exec -T -e PGPASSWORD=store_local postgres psql -h localhost -U store_app -d store_db -v ON_ERROR_STOP=1 -c "INSERT INTO orders(id,created_at,order_sum,items) VALUES(987654321,now(),1.00,'[]'::jsonb);"
          docker compose up -d --no-deps --force-recreate --no-build --wait --wait-timeout 180 store-service tariffs-service warehouse-service
          test "$(docker compose exec -T -e PGPASSWORD=store_local postgres psql -h localhost -U store_app -d store_db -Atc 'SELECT count(*) FROM orders WHERE id=987654321')" = 1
          test "$(docker compose exec -T -e PGPASSWORD=tariffs_local postgres psql -h localhost -U tariffs_app -d tariffs_db -Atc 'SELECT count(*) FROM tariffs')" = 7
          test "$(docker compose exec -T -e PGPASSWORD=tariffs_local postgres psql -h localhost -U tariffs_app -d tariffs_db -Atc 'SELECT count(*) FROM tariff_rules')" = 14
          test "$(docker compose exec -T -e PGPASSWORD=warehouse_local postgres psql -h localhost -U warehouse_app -d warehouse_db -Atc 'SELECT count(*) FROM stores')" = 2
          curl --fail --silent http://localhost:6791/stores/S-1/deliveries/D-1 | jq -e '.state == "POSTED" and .deliverySequence == 1 and .items[0].salePrice == "120.00"'
          test "$(docker compose exec -T -e PGPASSWORD=warehouse_local postgres psql -h localhost -U warehouse_app -d warehouse_db -Atc "SELECT count(*) FROM warehouse_outbox WHERE store_id='S-1' AND delivery_id='D-1' AND publication_status='PUBLISHED'")" = 1
          curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -e '.items | length == 1'
          curl --fail --silent http://localhost:6789/stores/S-1/catalog | jq -e '.items[0].availableQuantity == 7 and .items[0].unitPrice == "120.00"'
          curl --fail --silent "http://localhost:6789/stores/S-1/carts/$SMOKE_CART" | jq -e '.state == "SUBMITTED" and .version == 3 and .items[0].quantity == 3 and .totalAmount == "360.00"'
          curl --fail --silent "http://localhost:6789/stores/S-1/submissions/$SMOKE_SUBMISSION" | jq -e '.publicationStatus == "PUBLISHED"'
          test "$(docker compose exec -T -e PGPASSWORD=store_local postgres psql -h localhost -U store_app -d store_db -Atc 'SELECT count(*) FROM stock_movements')" = 1
          test "$(docker compose exec -T -e PGPASSWORD=store_local postgres psql -h localhost -U store_app -d store_db -Atc 'SELECT count(*) FROM stock_expenses WHERE quantity=3')" = 1
          test "$(docker compose exec -T -e PGPASSWORD=store_local postgres psql -h localhost -U store_app -d store_db -Atc "SELECT count(*) FROM store_outbox WHERE publication_status='PUBLISHED'")" = 1
      - name: Save Compose diagnostics
        if: always()
        run: docker compose logs --no-color > compose-smoke.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: compose-smoke-logs
          path: compose-smoke.log
      - name: Stop smoke containers
        if: always()
        run: docker compose down
